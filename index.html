<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Glass Background 9:16</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      background: #000000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.32);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      font-size: 11px;
      letter-spacing: 0.4px;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.4s ease;
    }

    body.clean .hint {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
  </div>
  <div class="hint" id="hint">F — fullscreen · H — скрыть подсказку</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.169.0/build/three.module.js";

    const stage = document.getElementById("stage");
    const canvas = document.getElementById("scene");
    const hint = document.getElementById("hint");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.055);

    const camera = new THREE.PerspectiveCamera(42, 9 / 16, 0.1, 100);
    camera.position.set(0, 0.3, 7.2);

    // Освещение
    const ambient = new THREE.AmbientLight(0x88c8ff, 0.55);
    scene.add(ambient);

    const blueLight1 = new THREE.PointLight(0x0098ea, 14, 18);
    blueLight1.position.set(-2.4, 2.2, 3.2);
    scene.add(blueLight1);

    const blueLight2 = new THREE.PointLight(0x38bdf8, 10, 16);
    blueLight2.position.set(2.5, -2.0, 2.8);
    scene.add(blueLight2);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.1);
    rimLight.position.set(0, 5, 4);
    scene.add(rimLight);

    // Световая волна (сетка с плавной деформацией)
    const waveGeo = new THREE.PlaneGeometry(9.5, 9.5, 96, 96);
    waveGeo.rotateX(-Math.PI / 2.35);
    const basePositions = Float32Array.from(waveGeo.attributes.position.array);

    const waveMat = new THREE.MeshStandardMaterial({
      color: 0x061322,
      emissive: 0x004b7a,
      emissiveIntensity: 0.45,
      roughness: 0.25,
      metalness: 0.85,
      wireframe: false
    });
    const waveMesh = new THREE.Mesh(waveGeo, waveMat);
    waveMesh.position.set(0, -1.1, -0.5);
    scene.add(waveMesh);

    // Тонкая сетка поверх волны для глубины
    const wireGeo = waveGeo.clone();
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0x0098ea,
      wireframe: true,
      transparent: true,
      opacity: 0.14
    });
    const wireMesh = new THREE.Mesh(wireGeo, wireMat);
    wireMesh.position.copy(waveMesh.position);
    scene.add(wireMesh);

    // Стеклянные панели (glassmorphism planes)
    const glassGroup = new THREE.Group();
    scene.add(glassGroup);

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x101824,
      emissive: 0x001b2e,
      emissiveIntensity: 0.25,
      roughness: 0.12,
      metalness: 0.1,
      transmission: 0.55,
      transparent: true,
      opacity: 0.52,
      ior: 1.48,
      thickness: 0.4
    });

    const edgeMat = new THREE.LineBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.28
    });

    const panels = [];
    const panelConfigs = [
      { w: 2.3, h: 1.45, x: -1.15, y: 1.35, z: 0.6, rot: [0.16, 0.28, -0.06], speed: 0.65 },
      { w: 2.6, h: 1.25, x: 1.1, y: 0.15, z: 1.1, rot: [-0.12, -0.24, 0.05], speed: 0.5 },
      { w: 2.1, h: 1.65, x: -0.9, y: -1.35, z: 1.5, rot: [0.2, 0.18, 0.04], speed: 0.75 },
      { w: 1.8, h: 1.05, x: 1.25, y: 1.85, z: -0.4, rot: [-0.18, -0.32, -0.04], speed: 0.45 }
    ];

    panelConfigs.forEach((cfg) => {
      const boxGeo = new THREE.BoxGeometry(cfg.w, cfg.h, 0.05);
      const mesh = new THREE.Mesh(boxGeo, glassMat);
      mesh.position.set(cfg.x, cfg.y, cfg.z);
      mesh.rotation.set(...cfg.rot);

      const edges = new THREE.EdgesGeometry(boxGeo);
      const line = new THREE.LineSegments(edges, edgeMat);
      mesh.add(line);

      glassGroup.add(mesh);
      panels.push({ mesh, baseY: cfg.y, baseX: cfg.x, speed: cfg.speed });
    });

    // Частицы в пространстве
    const particleCount = 180;
    const pPositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      pPositions[i * 3] = (Math.random() - 0.5) * 7.5;
      pPositions[i * 3 + 1] = (Math.random() - 0.5) * 9.5;
      pPositions[i * 3 + 2] = (Math.random() - 0.5) * 5.5;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 0.045,
      transparent: true,
      opacity: 0.55
    });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    function resize() {
      const rect = stage.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    resize();
    window.addEventListener("resize", resize);

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "f") {
        if (!document.fullscreenElement) {
          stage.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      } else if (e.key.toLowerCase() === "h") {
        document.body.classList.toggle("clean");
      }
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Деформация волны
      const posAttr = waveGeo.attributes.position;
      const wirePosAttr = wireGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const ix = i * 3;
        const bx = basePositions[ix];
        const by = basePositions[ix + 1];
        const bz = basePositions[ix + 2];

        const dist = Math.hypot(bx, bz);
        const yOffset =
          Math.sin(bx * 0.9 + t * 1.15) * 0.28 +
          Math.cos(bz * 0.85 - t * 0.95) * 0.26 +
          Math.sin(dist * 1.4 - t * 1.4) * 0.14;

        posAttr.array[ix + 1] = by + yOffset;
        wirePosAttr.array[ix + 1] = by + yOffset + 0.015;
      }
      posAttr.needsUpdate = true;
      wirePosAttr.needsUpdate = true;
      waveGeo.computeVertexNormals();

      // Плавное движение стеклянных панелей
      panels.forEach((p, idx) => {
        p.mesh.position.y = p.baseY + Math.sin(t * p.speed + idx) * 0.18;
        p.mesh.position.x = p.baseX + Math.cos(t * p.speed * 0.7 + idx) * 0.1;
        p.mesh.rotation.y += 0.0015 * (idx % 2 === 0 ? 1 : -1);
      });

      // Движение источников света и камеры
      blueLight1.position.x = Math.sin(t * 0.6) * 2.6;
      blueLight1.position.y = 1.6 + Math.cos(t * 0.5) * 1.2;
      blueLight2.position.x = Math.cos(t * 0.55) * 2.6;

      particles.rotation.y = t * 0.03;
      particles.position.y = Math.sin(t * 0.3) * 0.15;

      camera.position.x = Math.sin(t * 0.28) * 0.35;
      camera.position.y = 0.3 + Math.cos(t * 0.22) * 0.2;
      camera.lookAt(0, -0.1, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
